name: Build DS (Docker)

on:
  push:
    branches: [Complete-Rework]
  pull_request:
    branches: [Complete-Rework]

jobs:
  build-ds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run devkitARM container to build
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/C_Engine/Makefiles \
            devkitpro/devkitarm \
            make -f makefile_ds

      - name: Upload .nds artifact
        uses: actions/upload-artifact@v3
        with:
          name: OpenBLOX.nds
          path: C_Engine/main.nds
