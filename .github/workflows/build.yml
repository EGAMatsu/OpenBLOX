name: Build OpenBLOX DS

on:
  push:
    branches: [Complete-Rework]
  pull_request:
    branches: [Complete-Rework]

jobs:
  build-ds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build using devkitARM container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src/C_Engine/Makefiles \
            devkitpro/devkitarm \
            make -f makefile_ds

      - name: Upload NDS build
        uses: actions/upload-artifact@v3
        with:
          name: OpenBLOX.nds
          path: C_Engine/main.nds
