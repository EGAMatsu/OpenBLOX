name: Build OpenBLOX DS (Complete Rework)

on:
  push:
    branches: [Complete-Rework]
  pull_request:
    branches: [Complete-Rework]

jobs:
  build-ds:
    name: 🕹️ Build DS .nds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up devkitARM container & build .nds
        run: |
          docker run --rm -v ${{ github.workspace }}:/project -w /project/C_Engine/Makefiles devkitpro/devkitarm make -f makefile_ds

      - name: Upload OpenBLOX.nds artifact
        uses: actions/upload-artifact@v3
        with:
          name: OpenBLOX.nds
          path: ./C_Engine/main.nds
